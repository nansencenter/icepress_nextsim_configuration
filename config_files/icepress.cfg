[forecast]
allow_no_restart=true
restart_tolerance=1
reforecast=false

[assimilation]
use_assimilation=true
assimilation_class=AssimConcASIP
assimilation_class=AssimThickSMOSCS2S3
date_shift=-1
change_existing_ice=false
date_shift_smos_altimeter=-5
weight_model=0.975
plot_innovations=false

[plot_moorings]
plot_moorings=false
title=neXtSIM forecast
ij_range=0 2180 260 2200
geodataset_class=MooringsArcMFC
mesh_file=large_arctic_bering_10km.msh
avg_period_hours=6
figname_prefix=nextsim_
#scalar variables to plot:
#varname colormap vmin vmax ice_edge_color colorbar_label
scalar_vars=sic cmocean.cm.ice 0 1 None Sea ice concentration
scalar_vars=sit viridis 0 4 None Sea ice thickness, m
scalar_vars=conc_myi cmocean.cm.ice 0 1 m MYI concentration
scalar_vars=sic_young cmocean.cm.ice 0 1 None Young ice concentration
scalar_vars=ridge_ratio cmocean.cm.ice 0 1 None Ridge ratio
scalar_vars=siage viridis 0 2.5 None Sea ice age, years
#scalar_vars=sialb viridis 0 1 None Sea ice albedo
#vector variables to plot:
#uname vname varname mask_var_name plot_deformation colormap vmin vmax ice_edge_color colorbar_label
vector_vars=siu siv siuv sic True jet 0 .3 None Sea ice velocity, m$\,$s$^{-1}$

[cmems]
make_files=false
reanalysis=false
moorings_file_mask=Moorings_%Yd%j.nc
name_mapping=sic,siconc
name_mapping=sit,sithick
name_mapping=snt,sisnthick
name_mapping=siu,vxsi
name_mapping=siv,vysi
name_mapping=sialb,sialb
name_mapping=siage,siage
name_mapping=sic_young,siconc_young
name_mapping=conc_myi,siconc_my
name_mapping=ridge_ratio,si_ridge_ratio
name_mapping=meltpond_fraction,simpconc
product_name=ARCTIC_ANALYSISFORECAST_PHY_ICE_002_011
production_unit=ARC-NERSC-BERGEN-NO
daily_dataset_tag=202611
daily_dataset_name=cmems_mod_arc_phy_anfc_nextsim_hm
daily_file_mask=%Y/%m/%Y%m%d_hr-nersc-MODEL-nextsimf-ARC-bBULLETINDATE-fv00.0.nc
num_records_per_daily_file=24
daily_deadline=9 0
monthly_dataset_tag=202611
monthly_dataset_name=cmems_mod_arc_phy_anfc_nextsim_P1M-m
monthly_file_mask=%Y/%Y%m_mm-nersc-MODEL-nextsimf-ARC-fv00.0.nc
monthly_deadline=2 12 0
lftp_bookmark=cmems-nrt
clean_local_disk=true
climatology_dataset_tag=202611
climatology_dataset_name=rean_clim
climatology_file_mask=rean_clim_%m.nc
climatology_start=2024
climatology_end=2025
[cmems_mpf_dim]
name=area_type
value=sea_ice_melt_pond
standard_name=area_type
long_name=Surface Type
units=1
[cmems_mpf]
moorings_name=meltpond_fraction
standard_name=area_fraction
long_name=Area Fraction of Melt Ponds on Sea Ice

[compress_moorings]
compress=false # don't need compression anymore (now done by nextsim)

[local_storage]
do_cleaning=false
num_bulletins_to_store=31
num_compressed_bulletins_to_store=62
num_cmems_bulletins_to_store=62

[mpi]
num_tasks=8
mpi_run_command=mpirun
num_tasks_option_name=-np

[nextsim]
mesh.filename=large_arctic_bering_10km_JBFpatch.msh

setup.ice-type=topaz5_nrt
setup.ocean-type=topaz5_nrt
setup.atmosphere-type=ecmwf_nrt
setup.bathymetry-type=etopo
setup.use_assimilation=false
setup.dynamics-type=bbm
setup.atmospheric_forcing_input_path=ECMWF_NRT_Arctic
setup.oceanic_forcing_input_path=TOPAZ5RC_daily

simul.spinup_duration=0
simul.timestep=900

thermo.use_assim_flux=false
thermo.assim_flux_exponent=4
thermo.diffusivity_sss=0
thermo.diffusivity_sst=0
thermo.ocean_nudge_timeS_days=10
thermo.ocean_nudge_timeT_days=10
thermo.freezingpoint-type=linear
thermo.freezingpoint_mu=.053
thermo.h_young_max=.23
thermo.snow_cond=.2
thermo.alb_ice=.86
thermo.alb_sn=.9
thermo.albedoW=.07
thermo.melt_type=2
thermo.PhiM=.2
thermo.alb_ponds=.35
thermo.use_meltponds=true
thermo.meltpond_depth_to_fraction=1
thermo.meltpond_runoff_fraction=.8

dynamics.time_relaxation_damage=15
dynamics.compression_factor=7e3
dynamics.C_lab=1.35e6
dynamics.substeps=120
dynamics.use_temperature_dependent_healing=true
dynamics.ECMWF_quad_drag_coef_air=2.125e-3
dynamics.quad_drag_coef_water=0.0061625
dynamics.Lemieux_basal_k1=7
dynamics.compaction_param=-30
dynamics.oceanic_turning_angle=20

age.include_young_ice=false

restart.start_from_restart=true
restart.type=extend
restart.write_initial_restart=true
restart.write_interval_restart=true
restart.output_interval=1
restart.check_restart=true

output.output_per_day=0
output.datetime_in_filename=true
output.variables=M_VT
output.variables=SST
output.variables=SSS
output.variables=Ridge_ratio
output.variables=Damage
output.variables=Thickness_young_ice
output.variables=Snow_young_ice
output.variables=Concentration_young_ice
output.variables=Concentration
output.variables=Thickness
output.variables=Snow

moorings.use_moorings=true
# production runs:
moorings.grid_type=from_file
moorings.grid_file=topaz6_grid.nc
moorings.grid_latitude=latitude
moorings.grid_longitude=longitude
moorings.output_timestep=4
moorings.output_time_step_units=time_steps
## test runs:
#moorings.spacing=10
#moorings.output_timestep=.125
# standard
moorings.file_length=daily
moorings.variables=conc
moorings.variables=thick
moorings.variables=snow
moorings.variables=velocity
moorings.variables=sialb
moorings.variables=albedo
moorings.variables=conc_myi
moorings.variables=conc_young
moorings.variables=age
moorings.variables=meltpond_fraction
moorings.variables=ridge_ratio

drifters.use_osisaf_drifters=false
drifters.use_sidfex_drifters=false
drifters.sidfex_drifters_output_time_step=0.125
drifters.sidfex_ignore_restart=true

debugging.check_fields_fast=true
